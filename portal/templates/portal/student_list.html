{% extends 'portal/base.html' %}

{% block content %}
<div class="container mt-5">

<h2>Student List</h2>

<table class="table table-bordered table-striped">
<tr>
<th>ID</th>
<th>Name</th>
<th>Course</th>
<th>Email</th>
<th>Action</th>
</tr>

{% for s in students %}
<tr>
<td>{{ s.id }}</td>
<td>{{ s.name }}</td>
<td>{{ s.course }}</td>
<td>{{ s.email }}</td>
<td>
<a href="/student/{{ s.id }}/" class="btn btn-primary btn-sm">View</a>
</td>
</tr>
{% endfor %}

</table>

</div>
{% endblock %}
