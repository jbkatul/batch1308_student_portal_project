{% extends 'portal/base.html' %}

{% block content %}

<h2>Student List</h2>

<form method="GET" action="{% url 'search_student' %}" class="mb-3">
    <input type="text" name="q" class="form-control" placeholder="Search by name">
</form>

<table class="table table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Email</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.email }}</td>
            <td>
                <a href="{% url 'student_detail' student.id %}" class="btn btn-primary btn-sm">View</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No Students Found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
