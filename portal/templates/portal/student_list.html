{% extends "portal/base.html" %}
{% block content %}

<h2>Student List</h2>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Department</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Grade</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.department }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.phone }}</td>
            <td>{{ student.grade }}</td>
            <td>
                <a href="/students/{{ student.id }}/" class="btn btn-info btn-sm">View</a>
                <a href="/edit-student/{{ student.id }}/" class="btn btn-warning btn-sm">Edit</a>

                <form action="/delete-student/{{ student.id }}/" method="POST" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
