<body>
    <div class="container mt-5">
        <h2>Student List</h2>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Email</th>
                    <th>Button</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.course }}</td>
                    <td>{{ student.email }}</td>
                    <td><button class="btn btn-primary">view</button></td>
                </tr>
                
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
