<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #db7933 0%, #f286c0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-card {
            max-width: 450px;
            margin: 80px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            padding: 30px;
        }
        .register-card h3 {
            margin-bottom: 20px;
            font-weight: bold;
            color: #333;
        }
        .form-control {
            border-radius: 8px;
        }
        .btn-primary {
            width: 100%;
            border-radius: 8px;
            background: #ee0979;
            border: none;
        }
        .btn-primary:hover {
            background: #d3076b;
        }
        .login-link {
            margin-top: 15px;
            display: block;
            text-align: center;
        }
        .error-message {
            color: red;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        
    </style>
</head>
<body>
    <div class="register-card">
        <h3 class="text-center">Create Your Account</h3>
        <form method="POST" action="{% url 'registration' %}">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Enter your Name" class="form-control mb-3" required>
            <input type="email" name="email" placeholder="Enter your Email" class="form-control mb-3" required>
            <input type="password" name="upass1" placeholder="Enter your Password" class="form-control mb-3" required>
            <input type="password" name="upass2" placeholder="Re-enter your Password" class="form-control mb-3" required>
            <input type="submit" value="Register" class="btn btn-primary">

            {% if mismatch %}
            <div class="error-message">{{ mismatch }}</div>
            {% endif %}
            {% if both_taken %}
            <div class="error-message">{{ both_taken }}</div>
            {% endif %}
            {% if email_taken %}
            <div class="error-message">{{ email_taken }}</div>
            {% endif %}
            {% if U_taken %}
            <div class="error-message">{{ U_taken }}</div>
            {% endif %}
        </form>

        <div class="login-link">
            Already Registered? <a href="{% url 'login' %}" style="text-decoration:none; color:#ee0979;">Sign In</a>
        </div>
    </div>
</body>
</html>
