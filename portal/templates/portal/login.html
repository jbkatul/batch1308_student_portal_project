<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #6eefe6 0%, #5a8be2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            max-width: 400px;
            margin: 100px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            padding: 30px;
        }
        .login-card h3 {
            margin-bottom: 20px;
            font-weight: bold;
            color: #333;
        }
        .form-control {
            border-radius: 8px;
        }
        .btn-primary {
            width: 100%;
            border-radius: 8px;
            background: #2575fc;
            border: none;
        }
        .btn-primary:hover {
            background: #1a5edb;
        }
        .register-link {
            margin-top: 15px;
            display: block;
            text-align: center;
        }
        .error-message {
            color: red;
            margin-top: 10px;
            font-size: 0.9rem;
        }

    
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="text-center">Welcome Back</h3>
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="text" placeholder="Enter your Username" name="username" class="form-control mb-3" required>
            <input type="password" placeholder="Enter your Password" name="password" class="form-control mb-3" required>
            <input type="submit" value="Login" class="btn btn-primary">
            
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            
            <div class="register-link">
                New User? <a href="{% url 'registration' %}" style="text-decoration:none; color:#2575fc;">Register here</a>
            </div>
        </form>
    </div>
</body>
</html>
