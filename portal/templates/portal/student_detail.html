{% extends 'portal/base.html' %}

{% block content %}

{% if student %}
<div class="card">
    <div class="card-body">
        <h3>{{ student.name }}</h3>
        <p><strong>Course:</strong> {{ student.course }}</p>
        <p><strong>Email:</strong> {{ student.email }}</p>
    </div>
</div>
{% else %}
<p>Student not found</p>
{% endif %}

{% endblock %}
