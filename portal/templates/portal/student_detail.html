{% extends 'portal/base.html' %}
{% block content %}

<div class="card p-4 student-card text-center">

    <img src="{{ student.photo }}" class="student-img mx-auto">

    <h4 class="mt-2">{{ student.name }}</h4>

    <p><strong>Course:</strong> {{ student.course }}</p>
    <p><strong>Email:</strong> {{ student.email }}</p>

    <div class="mt-3">
        <a href="/students/" class="btn btn-secondary btn-sm btn-custom">Back</a>

        <a href="/delete/{{ student.id }}/"
           class="btn btn-danger btn-sm btn-custom">
           Delete Student
        </a>
    </div>

</div>

{% endblock %}
