{% extends 'portal/base.html' %}
{% load static %}
{% block content %}

<div class="cover-bg">
    <div class="cover-content">
        <h1>Welcome to Student Portal</h1>
        <p>Manage Students, Courses and Information Easily</p>
        <a href="{% url 'login' %}" class="btn btn-light mr-2">Login</a>
        <a href="{% url 'register' %}" class="btn btn-outline-light">Register</a>
    </div>
</div>

<div class="container mt-5">
    <h3 class="text-center mb-4">Our Courses</h3>

    <div class="row">

        {% for course in courses %}
<div class="col-md-3 mb-4">
    <div class="flip-card">
        <div class="flip-card-inner">

            <div class="flip-card-front">
                <h4>{{ course }}</h4>
                <i class="fas fa-book fa-2x"></i>
            </div>

            <div class="flip-card-back">
                <p>Click to explore students</p>
                <a href="{% url 'student_list' %}"
                   class="btn btn-light btn-sm">
                    View Students
                </a>
            </div>

        </div>
    </div>
</div>
{% endfor %}

    </div>
</div>

{% endblock %}
