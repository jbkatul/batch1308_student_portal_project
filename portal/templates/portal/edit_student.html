{% extends "portal/base.html" %}
{% block content %}

<h2>Edit Student</h2>

<form method="POST" class="card p-4 shadow">
    {% csrf_token %}

    <input type="text" name="name" value="{{ student.name }}" class="form-control mb-3" required>
    <input type="email" name="email" value="{{ student.email }}" class="form-control mb-3" required>
    <input type="text" name="department" value="{{ student.department }}" class="form-control mb-3" required>
    <input type="text" name="phone" value="{{ student.phone }}" class="form-control mb-3" required>

    <button type="submit" class="btn btn-primary w-100">Update</button>
</form>

{% endblock %}
