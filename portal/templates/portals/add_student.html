{% extends "portals/base.html" %}

{% block title %} Add Student {% endblock %}

{% block content %}

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center">
                    <h4 class="mb-0">Add New Student</h4>
                </div>

                <div class="card-body p-4">

                    <form method="POST" onsubmit="return handleSubmit(event)">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Student Name</label>
                            <input type="text" name="name" class="form-control" placeholder="Enter student name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Course</label>
                            <input type="text" name="course" class="form-control" placeholder="Enter course name" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">
                                Add Student
                            </button>

                            <a href="{% url 'student_list' %}" class="btn btn-outline-secondary">
                                Back to List
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
function handleSubmit(event) {
    event.preventDefault();

    Swal.fire({
        title: "Success!",
        text: "Student added successfully.",
        icon: "success",
        confirmButtonColor: "#198754"
    }).then(() => {
        event.target.submit();
    });

    return false;
}
</script>

{% endblock %}
