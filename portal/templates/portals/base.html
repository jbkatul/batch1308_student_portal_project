<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Student Portal{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }

        .navbar-brand {
            letter-spacing: 1px;
            font-size: 1.3rem;
        }

        .nav-link {
            transition: 0.3s;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #0d6efd !important;
        }

        .nav-link.active {
            color: #0d6efd !important;
        }

        main {
            padding-top: 20px;
            padding-bottom: 40px;
        }

        footer {
            margin-top: auto;
        }

        .footer-text {
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            <i class="bi bi-mortarboard-fill"></i> Student Portal
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" 
                       href="{% url 'home' %}">
                        <i class="bi bi-house-door"></i> Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if 'students' in request.path %}active{% endif %}" 
                       href="{% url 'student_list' %}">
                        <i class="bi bi-people"></i> Students
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if 'add' in request.path %}active{% endif %}" 
                       href="{% url 'add_student' %}">
                        <i class="bi bi-person-plus"></i> Add Student
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if 'about' in request.path %}active{% endif %}" 
                       href="{% url 'about' %}">
                        <i class="bi bi-info-circle"></i> About
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- ===== PAGE CONTENT ===== -->
<main class="flex-fill">
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</main>

<!-- ===== FOOTER ===== -->
<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0 footer-text">
        © 2026 Student Portal | Built with Django & Bootstrap
    </p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
